# PHASE 2 — MODÈLE INACTIF. Ce fichier vit dans phase2/ : GitHub ne lit que
# .github/workflows/, il ne se passe donc rien tant qu'il n'est pas copié là.
# Ne rien faire tant qu'il n'y a pas de domaine ni de tunnel Cloudflare à
# adresse fixe. Marche à suivre complète : « Phase 2 » dans le README.
#
# En deux lignes :
#   1. Créer les quatre secrets du dépôt (Settings → Secrets and variables →
#      Actions) : MEMOIRE_API_URL (https://… du tunnel), MEMOIRE_API_KEY (la
#      clé du dashboard, MCP_API_KEY côté serveur), MEMOIRE_CF_ACCESS_CLIENT_ID
#      et MEMOIRE_CF_ACCESS_CLIENT_SECRET (jeton de service Cloudflare Access).
#   2. Copier ce fichier dans .github/workflows/export-quotidien.yml et pousser.
#
# scripts/export.py ne change pas : il lit ces quatre valeurs dans
# l'environnement avant de regarder .env, refuse une adresse distante en
# http://, et n'écrit jamais l'adresse du tunnel dans le journal public.
#
# Chaque nuit, dans cet ordre : export (commit local seulement) → les deux
# suites de tests relisent le docs/data.json qui vient d'être écrit → push.
# Ce contrôle est ici parce qu'il ne peut pas être ailleurs : un envoi fait
# avec GITHUB_TOKEN ne déclenche aucun workflow, donc .github/workflows/
# tests.yml ne tournera jamais sur les commits de ce robot.
#
# Pour arrêter l'export automatique : Actions → « Export quotidien de la
# mémoire » → Disable workflow (ou supprimer le fichier de .github/workflows/).
# GitHub désactive de lui-même un déclenchement planifié après 60 jours sans
# activité dans le dépôt ; il se réactive d'un clic depuis l'onglet Actions.

name: Export quotidien de la mémoire

on:
  schedule:
    - cron: "0 0 * * *"   # minuit UTC, chaque jour (GitHub peut le retarder de quelques minutes)
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions
    inputs:
      force:
        description: "Publier même si le nombre d'entrées a chuté de plus de moitié"
        type: boolean
        default: false
      recalculer_voisins:
        description: "Recalculer les voisins de toutes les entrées (lent : une recherche par entrée)"
        type: boolean
        default: false

permissions:
  contents: write          # commit et push de docs/data.json
  issues: write            # issue d'alerte si l'export échoue

concurrency:
  group: export-memoire
  cancel-in-progress: false   # jamais interrompre un export en cours de publication

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # lecture + voisins (budget 120 s côté script) + les deux suites + push
    steps:
      # Profondeur 1 : il suffit d'avoir docs/data.json du dernier export, dont
      # l'export reprend les voisins déjà calculés. checkout garde le jeton du
      # dépôt dans la copie de travail, c'est lui qui autorisera le push.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # export.py : bibliothèque standard, 3.9+

      - uses: actions/setup-node@v4
        with:
          node-version: "22"       # suite du site, jouée avant la publication

      - name: Identité git du bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Sur une exécution planifiée, « inputs » est vide : aucune option n'est
      # ajoutée, l'export se fait avec ses garde-fous. --no-push : le commit
      # reste ici tant que les deux suites n'ont pas relu ce qu'il contient.
      - name: Export (commit local, sans publication)
        env:
          MEMOIRE_API_URL: ${{ secrets.MEMOIRE_API_URL }}
          MEMOIRE_API_KEY: ${{ secrets.MEMOIRE_API_KEY }}
          MEMOIRE_CF_ACCESS_CLIENT_ID: ${{ secrets.MEMOIRE_CF_ACCESS_CLIENT_ID }}
          MEMOIRE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.MEMOIRE_CF_ACCESS_CLIENT_SECRET }}
        run: >-
          python scripts/export.py --no-push
          ${{ inputs.force && '--force' || '' }}
          ${{ inputs.recalculer_voisins && '--recalculer-voisins' || '' }}

      # Le filet de la phase 1 : les envois du robot ne déclenchent pas
      # tests.yml (GitHub ne lance aucun workflow sur un événement venu de
      # GITHUB_TOKEN). Les deux suites sont donc jouées ici, entre l'export et
      # le push : tests/js/schema.test.mjs et tests/test_admin.py relisent le
      # docs/data.json qui vient d'être écrit. Si l'une casse, rien n'est
      # publié, le site garde l'export de la veille et l'alerte s'ouvre.
      - name: Contrôle du data.json produit
        run: |
          python -m unittest discover -s tests
          node --test "tests/js/*.test.mjs"

      - name: Publication
        run: git push

      # Pour ne plus recevoir ces alertes : supprimer les deux étapes ci-dessous
      # (l'échec reste visible en rouge dans l'onglet Actions).
      - name: Alerte — ouvrir ou compléter une issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITRE: "L'export quotidien de la mémoire a échoué"
          JOURNAL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          numero=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITRE\") | .number" | head -n 1)
          corps=$(printf '%s\n\n%s\n\n%s\n' \
            "L'export automatique n'est pas passé (exécution du $(date -u '+%d/%m/%Y à %H:%M UTC'))." \
            "Journal complet : $JOURNAL" \
            "Le site garde le dernier export réussi. En attendant, le raccourci « Mettre à jour Mémoire Vive » du Bureau fonctionne toujours.")
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body "$corps"   # une seule issue, un commentaire par échec
          else
            gh issue create --title "$TITRE" --body "$corps"
          fi

      - name: Refermer l'issue d'alerte si tout est rentré dans l'ordre
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITRE: "L'export quotidien de la mémoire a échoué"
        run: |
          numero=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITRE\") | .number" | head -n 1)
          if [ -n "$numero" ]; then
            gh issue close "$numero" --comment "L'export automatique est repassé : rien à faire."
          fi
